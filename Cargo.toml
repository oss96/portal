[package]
name = "portal"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
eframe = "0.36"
egui_extras = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2.1"
ssh2-config = "0.8"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
egui_kittest = { version = "0.36.1", default-features = false, features = ["wgpu"], optional = true }

[build-dependencies]
winresource = "0.1"

[features]
# The offscreen screenshot harness: `cargo run --features shots`.
shots = ["dep:egui_kittest"]
